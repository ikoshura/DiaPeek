<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#6a5cf5}
.stage{width:1400px;height:560px;background:linear-gradient(135deg,#4f68f7,#7a5cf5);font-family:-apple-system,system-ui,'Segoe UI',sans-serif;display:flex;align-items:center;padding:0 90px;gap:60px;position:relative;overflow:hidden}
.left{flex:1}
.brand{display:flex;align-items:center;gap:24px}
.icon{width:120px;height:120px;border-radius:22%;background:rgba(255,255,255,.16);position:relative;flex:none}
.icon .page{position:absolute;left:16%;top:28%;width:24%;height:44%;background:rgba(255,255,255,.45);border-radius:16%}
.icon .panel{position:absolute;left:46%;top:22%;width:40%;height:56%;background:#fff;border-radius:18%}
.brand h1{font-size:76px;font-weight:800;color:#fff;letter-spacing:-1px}
.left p{font-size:30px;color:rgba(255,255,255,.92);margin-top:24px;line-height:1.35;max-width:640px}
.peek{width:360px;height:400px;flex:none;background:#fff;border-radius:18px;box-shadow:0 26px 60px rgba(0,0,0,.30);overflow:hidden}
.ptb{height:52px;background:#f5f5f7;display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:0 12px;color:#444}
.pbody{padding:22px}
.pimg{height:150px;background:#eceff5;border-radius:10px}
.pline{height:15px;background:#dfe3ec;border-radius:8px;margin-top:16px}
svg{width:18px;height:18px;display:block}
</style></head><body>
<div class="stage">
  <div class="left">
    <div class="brand"><div class="icon"><div class="page"></div><div class="panel"></div></div><h1>DiaPeek</h1></div>
    <p>Open links in a Peek — without leaving the page.</p>
  </div>
  <div class="peek">
    <div class="ptb">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><line x1="9.75" y1="2.75" x2="9.75" y2="13.25"/></svg>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.25H4.25A1.25 1.25 0 0 0 3 4.5v7.25A1.25 1.25 0 0 0 4.25 13h7.25A1.25 1.25 0 0 0 12.75 11.75V9"/><path d="M9.5 2.75h3.75V6.5"/><path d="M13.25 2.75 7.25 8.75"/></svg>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>
    </div>
    <div class="pbody"><div class="pimg"></div><div class="pline" style="width:75%"></div><div class="pline" style="width:90%"></div><div class="pline" style="width:60%"></div></div>
  </div>
</div></body></html>
