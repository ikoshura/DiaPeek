<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
.stage{width:440px;height:280px;background:linear-gradient(180deg,#eef1ff,#f8f9fd);font-family:-apple-system,system-ui,'Segoe UI',sans-serif;display:flex;align-items:center;gap:26px;padding:0 40px}
.icon{width:100px;height:100px;border-radius:22%;background:#4f68f7;position:relative;flex:none;box-shadow:0 10px 26px rgba(79,104,247,.35)}
.icon .page{position:absolute;left:12.5%;top:27%;width:27%;height:46%;background:#6f84f9;border-radius:16%}
.icon .panel{position:absolute;left:45%;top:22%;width:42%;height:56%;background:#fff;border-radius:18%}
.txt h1{font-size:40px;font-weight:800;color:#1b2140;letter-spacing:-.5px}
.txt p{font-size:19px;color:#5b6480;margin-top:6px}
</style></head><body>
<div class="stage">
  <div class="icon"><div class="page"></div><div class="panel"></div></div>
  <div class="txt"><h1>DiaPeek</h1><p>Open links in a Peek</p></div>
</div></body></html>
