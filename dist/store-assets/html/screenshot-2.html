<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
.stage{width:1280px;height:800px;background:linear-gradient(180deg,#eef1ff,#f6f7fc);font-family:-apple-system,system-ui,'Segoe UI',sans-serif;position:relative;overflow:hidden}
.head{text-align:center;padding:52px 40px 0}
.head h1{font-size:44px;font-weight:800;color:#1b2140;letter-spacing:-.5px}
.head p{font-size:22px;color:#5b6480;margin-top:14px}
.browser{position:absolute;left:150px;right:150px;top:190px;bottom:64px;background:#fff;border-radius:16px;box-shadow:0 30px 70px rgba(30,40,90,.22);overflow:hidden}
.tb{height:52px;background:#eef0f5;display:flex;align-items:center;padding:0 16px;gap:8px}
.dot{width:12px;height:12px;border-radius:50%}
.addr{flex:1;height:28px;background:#dfe2ea;border-radius:8px;margin-left:12px}
.content{position:absolute;top:52px;left:0;right:0;bottom:0;display:flex}
.pane{flex:1;background:#fff;padding:34px 36px;position:relative}
.right{border-left:1px solid rgba(0,0,0,.08)}
.rtb{position:absolute;top:0;left:0;right:0;height:44px;background:#f5f5f7;display:flex;align-items:center;justify-content:flex-end;gap:2px;padding:0 10px}
.pbtn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#444}
.blk{background:#e9ebf1;border-radius:7px}
.img{background:#eceff5;border-radius:10px}
svg{width:16px;height:16px;display:block}
</style></head><body>
<div class="stage">
  <div class="head"><h1>Split view — page and Peek side by side</h1>
  <p>Keep working on the left while the Peek stays open on the right.</p></div>
  <div class="browser">
    <div class="tb"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="addr"></span></div>
    <div class="content">
      <div class="pane">
        <div class="blk" style="width:70%;height:24px"></div>
        <div class="blk" style="width:88%;height:13px;margin-top:16px"></div>
        <div class="blk" style="width:80%;height:13px;margin-top:10px"></div>
        <div class="img" style="width:88%;height:150px;margin-top:22px"></div>
        <div class="blk" style="width:75%;height:13px;margin-top:22px"></div>
        <div class="blk" style="width:82%;height:13px;margin-top:10px"></div>
      </div>
      <div class="pane right">
        <div class="rtb">
          <span class="pbtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><line x1="9.75" y1="2.75" x2="9.75" y2="13.25"/></svg></span>
          <span class="pbtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.25H4.25A1.25 1.25 0 0 0 3 4.5v7.25A1.25 1.25 0 0 0 4.25 13h7.25A1.25 1.25 0 0 0 12.75 11.75V9"/><path d="M9.5 2.75h3.75V6.5"/><path d="M13.25 2.75 7.25 8.75"/></svg></span>
          <span class="pbtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg></span>
        </div>
        <div style="margin-top:34px"></div>
        <div class="img" style="width:100%;height:150px"></div>
        <div class="blk" style="width:80%;height:13px;margin-top:20px"></div>
        <div class="blk" style="width:92%;height:13px;margin-top:10px"></div>
        <div class="blk" style="width:70%;height:13px;margin-top:10px"></div>
      </div>
    </div>
  </div>
</div></body></html>
