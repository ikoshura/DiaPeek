<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
.stage{width:1280px;height:800px;background:linear-gradient(180deg,#eef1ff,#f6f7fc);font-family:-apple-system,system-ui,'Segoe UI',sans-serif;position:relative;overflow:hidden}
.head{text-align:center;padding:52px 40px 0}
.head h1{font-size:44px;font-weight:800;color:#1b2140;letter-spacing:-.5px}
.head p{font-size:22px;color:#5b6480;margin-top:14px}
.browser{position:absolute;left:150px;right:150px;top:190px;bottom:64px;background:#fff;border-radius:16px;box-shadow:0 30px 70px rgba(30,40,90,.22);overflow:hidden}
.tb{height:52px;background:#eef0f5;display:flex;align-items:center;padding:0 16px;gap:8px}
.dot{width:12px;height:12px;border-radius:50%}
.addr{flex:1;height:28px;background:#dfe2ea;border-radius:8px;margin-left:12px;display:flex;align-items:center;padding:0 14px;color:#8b90a0;font-size:14px}
.content{position:absolute;top:52px;left:0;right:0;bottom:0;background:#fff;padding:36px 40px}
.blk{background:#e9ebf1;border-radius:7px}
.dim{position:absolute;left:0;right:0;top:52px;bottom:0;background:rgba(18,20,32,.30)}
.peek{position:absolute;top:72px;right:20px;bottom:20px;width:52%;background:#fff;border-radius:14px;box-shadow:-8px 12px 40px rgba(0,0,0,.35);overflow:hidden}
.ptb{height:44px;background:#f5f5f7;display:flex;align-items:center;padding:0 10px;gap:2px}
.paddr{flex:1;color:#5f5f66;font-size:13px;padding-left:6px}
.pbtn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#444}
.pbody{padding:22px 24px}
.pimg{height:150px;background:#eceff5;border-radius:10px}
.pline{height:14px;background:#dfe3ec;border-radius:7px;margin-top:14px}
svg{width:16px;height:16px;display:block}
</style></head><body>
<div class="stage">
  <div class="head"><h1>Open links in a Peek — without leaving the page</h1>
  <p>One click opens the link as a docked overlay instead of a new tab.</p></div>
  <div class="browser">
    <div class="tb"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="addr">news.example.com/article</span></div>
    <div class="content">
      <div class="blk" style="width:44%;height:26px"></div>
      <div class="blk" style="width:56%;height:14px;margin-top:16px"></div>
      <div class="blk" style="width:48%;height:14px;margin-top:10px"></div>
      <div class="blk" style="width:52%;height:170px;margin-top:22px"></div>
    </div>
    <div class="dim"></div>
    <div class="peek">
      <div class="ptb"><span class="paddr">product.example.org</span>
        <span class="pbtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><line x1="9.75" y1="2.75" x2="9.75" y2="13.25"/></svg></span>
        <span class="pbtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.25H4.25A1.25 1.25 0 0 0 3 4.5v7.25A1.25 1.25 0 0 0 4.25 13h7.25A1.25 1.25 0 0 0 12.75 11.75V9"/><path d="M9.5 2.75h3.75V6.5"/><path d="M13.25 2.75 7.25 8.75"/></svg></span>
        <span class="pbtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg></span>
      </div>
      <div class="pbody"><div class="pimg"></div><div class="pline" style="width:70%"></div><div class="pline" style="width:88%"></div><div class="pline" style="width:60%"></div></div>
    </div>
  </div>
</div></body></html>
