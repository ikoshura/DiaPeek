<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DiaPeek — Einstellungen</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>DiaPeek</h1>
      <p class="sub">
        Öffnet Links, die sonst einen neuen Tab öffnen würden, in einem
        Peek-Overlay.
      </p>

      <label class="toggle">
        <input type="checkbox" id="enabled" checked />
        <span>DiaPeek aktiviert</span>
      </label>

      <section>
        <h2>Darstellung</h2>
        <label class="radio">
          <input type="radio" name="mode" value="overlay" checked />
          <span><b>Sidepeek</b> — angedocktes In-Page-Overlay (mit Split-Option). Bettet die Seite per iframe ein.</span>
        </label>
        <label class="radio">
          <input type="radio" name="mode" value="window" />
          <span><b>Fenster</b> — eigenes, mittiges Fenster. Funktioniert auf allen Seiten (auch nicht-einbettbaren) und schließt beim Rausklicken.</span>
        </label>
      </section>

      <section>
        <h2>Was im Peek öffnen?</h2>
        <label class="check">
          <input type="checkbox" id="ic-newtab" checked />
          <span>
            Links, die einen neuen Tab öffnen
            <em class="hint">(<code>target="_blank"</code>, <code>window.open</code>, Mittelklick)</em>
          </span>
        </label>
        <label class="check">
          <input type="checkbox" id="ic-shift" checked />
          <span>⇧ Shift + Klick</span>
        </label>
        <p class="note">
          ⌘ Cmd (neuer Tab), ⌃ Ctrl (Kontextmenü) und ⌥ Option (nativer Split)
          bleiben immer nativ und werden nicht abgefangen.
        </p>
      </section>

      <div class="footer">
        <button id="save">Speichern</button>
        <button id="reset" class="secondary">Standard wiederherstellen</button>
        <span id="status"></span>
      </div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
